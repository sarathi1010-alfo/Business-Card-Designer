name: SEO & Deploy Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linting & Type Checking
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      # Add custom SEO checks here in the future
      # - name: Run SEO Validations
      #   run: node scripts/seo-checks.js

  deploy-to-vercel:
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}

  post-deploy-tasks:
    needs: deploy-to-vercel
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install googleapis
        run: npm install googleapis

      - name: Submit Sitemaps to GSC
        env:
          GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          SITE_URL: "https://alfo.online"
        run: node scripts/submit-sitemaps.mjs
